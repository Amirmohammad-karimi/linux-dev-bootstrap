name: Repository validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Reject accidental backup files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(\.save|\.bak|~)$'; then
            echo "Tracked backup files found." >&2
            exit 1
          fi

      - name: Validate feature manifests
        shell: bash
        run: |
          set -euo pipefail

          for file in             packages/apt.txt             packages/stm32-bundles.txt             packages/vscode-extensions.txt
          do
            awk -F'|' '
              /^[[:space:]]*($|#)/ { next }
              NF != 2 || $1 !~ /^ENABLE_[A-Z0-9_]+$/ || $2 ~ /^[[:space:]]*$/ {
                printf "%s:%d: invalid manifest entry: %s\n", FILENAME, FNR, $0
                bad=1
              }
              END { exit bad ? 1 : 0 }
            ' "$file"
          done
